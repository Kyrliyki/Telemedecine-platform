logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${spring.application.name:unknown-service}
        environment: ${observability.environment:unknown-env}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis
    metrics:
      tags:
        application: ${spring.application.name:unknown-service}