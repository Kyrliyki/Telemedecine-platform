[project]
name = "common-db"
version = "0.0.1"
description = "Async SQLAlchemy database setup with schema-per-service support"
requires-python = ">=3.14"
dependencies = [
    "sqlalchemy[asyncio]",
    "asyncpg",
    "pydantic-settings",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common_db"]
