[project]
name = "common-auth"
version = "0.0.1"
description = "Shared JWT authentication helpers for telemedicine Python services"
requires-python = ">=3.14"
dependencies = [
    "PyJWT[crypto]",
    "fastapi",
    "pydantic-settings",
    "redis",
    "prometheus-client",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common_auth"]
