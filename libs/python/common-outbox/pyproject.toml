[project]
name = "common-outbox"
version = "0.0.1"
description = "PostgreSQL transactional outbox for telemedicine Python services"
requires-python = ">=3.14"
dependencies = [
    "common-events",
    "common-db",
    "sqlalchemy[asyncio]",
    "pydantic-settings",
    "prometheus-client",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common_outbox"]

[tool.uv.sources]
common-events = { workspace = true }
common-db = { workspace = true }
