[project]
name = "common-web"
version = "0.0.1"
description = "FastAPI error, CORS and response conventions shared by Python services"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common_web"]
