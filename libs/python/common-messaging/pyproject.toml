[project]
name = "common-messaging"
version = "0.0.1"
description = "RabbitMQ integration events for telemedicine Python services"
requires-python = ">=3.14"
dependencies = [
    "aio-pika",
    "fastapi",
    "pydantic-settings",
    "common-events",
    "common-db",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common_messaging"]

[tool.uv.sources]
common-events = { workspace = true }
common-db = { workspace = true }
