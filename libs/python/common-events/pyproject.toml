[project]
name = "common-events"
version = "0.0.1"
description = "Shared integration event contracts for telemedicine Python services"
requires-python = ">=3.14"
dependencies = [
    "pydantic",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common_events"]
