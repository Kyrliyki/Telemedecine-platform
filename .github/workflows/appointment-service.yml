name: appointment-service

on:
  push:
    branches: [main]
    paths:
      - 'services/appointment-service/**'
      - 'libs/python/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - 'docker-compose.yml'
      - '.env.example'
      - 'infra/**'
      - '.github/workflows/appointment-service.yml'
      - '.github/workflows/_python-service.yml'
  pull_request:
    paths:
      - 'services/appointment-service/**'
      - 'libs/python/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - 'docker-compose.yml'
      - '.env.example'
      - 'infra/**'
      - '.github/workflows/appointment-service.yml'
      - '.github/workflows/_python-service.yml'
  workflow_dispatch:

jobs:
  appointment-serivce:
    uses: ./.github/workflows/_python-service.yml
    with:
      service: appointment-service
      service_dir: services/appointment-service
