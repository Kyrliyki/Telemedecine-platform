[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chat-service"
version = "0.1.0"
description = "Chat microservice for the telemedicine platform: dialogs, messages and WebSocket updates"
requires-python = ">=3.14"
dependencies = [
    "aio-pika",
    "alembic",
    "asyncpg",
    "fastapi",
    "httpx",
    "pydantic",
    "pydantic-settings",
    "pyjwt[crypto]",
    "redis",
    "sqlalchemy[asyncio]",
    "uvicorn[standard]",
    "common-auth",
    "common-observability",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "pytest",
    "pytest-asyncio",
    "ruff",
    "testcontainers",
]

[tool.uv.sources]
common-auth = { workspace = true }
common-observability = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests_chat_service"]
exclude = ["migrations/versions", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003", "RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests_chat_service"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
markers = ["integration: requires external services (Docker/Testcontainers)"]
