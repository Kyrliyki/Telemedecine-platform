server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: auth-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  config:
    import: classpath:application-observability.yml
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/telemedicine}
    username: ${DB_USER:telemedicine}
    password: ${DB_PASSWORD:telemedicine}
    hikari:
      schema: ${DB_SCHEMA:auth_service}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:auth_service}
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: ${DB_SCHEMA:auth_service}
    default-schema: ${DB_SCHEMA:auth_service}
    create-schemas: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true

auth:
  refresh-ttl: 30d
  access-ttl: ${AUTH_ACCESS_TTL:15m}
  invitation-ttl: 7d
  email-verification-ttl: 24h
  oauth-link-confirmation-ttl: 1h
  frontend-base-url: ${FRONTEND_URL:http://localhost:3000}
  frontend-oauth-callback-path: ${FRONTEND_OAUTH_CALLBACK_PATH:/oauth/callback}
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    email: ${BOOTSTRAP_ADMIN_EMAIL:admin@telemedicine.local}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  jwt:
    key-directory: ${JWT_KEY_DIR:.jwt}
    key-id: ${JWT_KEY_ID:auth-service-key}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8081/api/v1/auth/oauth/google/callback}
    jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
    issuer: https://accounts.google.com
    allowed-domains: []


messaging:
  enabled: true
  exchange: auth.events
  dlx: auth.events.dlx
  publisher-confirms: true

outbox:
  enabled: true
  batch-size: 100
  retention: 7d
  max-attempts: 5
  relay:
    interval: 1000
  cleanup:
    cron: "0 0 3 * * *"

management:
  server:
    port: ${MANAGEMENT_PORT:8091}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis,rabbitConnection

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}



security:
  jwt:
    issuer: auth-service
    jwk-set-uri: ${JWK_SET_URI:http://localhost:8080/oauth2/jwks}
    audience:
      - telemedicine
    clock-skew: 30s
    blacklist-enabled: true
  internal:
    enabled: ${SECURITY_INTERNAL_ENABLED:true}
    token: ${INTERNAL_SERVICE_TOKEN:}
    header: X-Internal-Token

observability:
  environment: ${ENV:dev}

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${spring.application.name:auth-service}
        environment: ${observability.environment:dev}
