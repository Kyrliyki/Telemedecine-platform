server:
  port: ${SERVER_PORT:8084}
  shutdown: graceful
  tomcat:
    connection-timeout: 5s

spring:
  application:
    name: schedule-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/telemedicine}
    username: ${DB_USER:telemedicine}
    password: ${DB_PASSWORD:telemedicine}
    hikari:
      schema: ${DB_SCHEMA:schedule_service}
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: 5000
      validation-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:schedule_service}
        jdbc:
          time_zone: UTC
      jakarta:
        persistence:
          query:
            timeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: ${DB_SCHEMA:schedule_service}
    default-schema: ${DB_SCHEMA:schedule_service}
    create-schemas: true
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
    connection-timeout: 5s
    requested-heartbeat: 30s
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        prefetch: 10
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s
          stateless: true

messaging:
  enabled: true
  exchange: schedule.events
  dlx: schedule.events.dlx
  publisher-confirms: true

outbox:
  enabled: true
  batch-size: 100
  retention: 7d
  max-attempts: 5
  relay:
    interval: 1000
  cleanup:
    cron: "0 0 3 * * *"

security:
  jwt:
    issuer: ${JWT_ISSUER:auth-service}
    jwk-set-uri: ${JWK_SET_URI:http://localhost:8080/oauth2/jwks}
    audience:
      - ${JWT_AUDIENCE:telemedicine}
    clock-skew: 30s
    blacklist-enabled: false
    jwk-set-timeout: 5s
  internal:
    enabled: ${SECURITY_INTERNAL_ENABLED:true}
    token: ${INTERNAL_SERVICE_TOKEN:}
    header: X-Internal-Token

schedule:
  max-range-days: ${SCHEDULE_MAX_RANGE_DAYS:62}
  hold-minutes: ${SCHEDULE_HOLD_MINUTES:15}
  max-slots-per-response: ${SCHEDULE_MAX_SLOTS_PER_RESPONSE:500}
  slot-retention: ${SCHEDULE_SLOT_RETENTION:365d}
  booking:
    lead-time: ${SCHEDULE_LEAD_TIME:1h}
    max-advance: ${SCHEDULE_MAX_ADVANCE:60d}
  appointment-service:
    base-url: ${APPOINTMENT_SERVICE_URL:http://appointment-service:8083}
    internal-token: ${INTERNAL_SERVICE_TOKEN:}
    reconcile-enabled: ${SCHEDULE_APPOINTMENT_RECONCILE_ENABLED:false}
    reconcile-interval: ${SCHEDULE_APPOINTMENT_RECONCILE_INTERVAL:3600000}
  user-service:
    base-url: ${USER_SERVICE_URL:http://user-service:8082}
    internal-token: ${INTERNAL_SERVICE_TOKEN:}
    validation-enabled: ${SCHEDULE_USER_VALIDATION_ENABLED:false}
  processed-events:
    retention: ${SCHEDULE_PROCESSED_EVENTS_RETENTION:30d}
    cleanup-cron: ${SCHEDULE_PROCESSED_EVENTS_CLEANUP_CRON:0 0 3 * * *}

management:
  server:
    port: ${MANAGEMENT_PORT:8094}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,rabbitConnection

observability:
  environment: ${ENV:dev}

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${spring.application.name:schedule-service}
        environment: ${observability.environment:dev}
